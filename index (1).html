<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STANDFADE earn</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0d0f1a;--card:#171a2b;--card2:#1f2338;--txt:#eef0ff;--mut:#8b90b3;--ac:#ffc83d;--ac2:#7c5cff;--ok:#38d98a;--bad:#ff5470;--bd:#2a2f4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#2a1f5e55,transparent),var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{font-weight:900;font-size:26px;letter-spacing:1px}
.logo b{color:var(--ac)}
.logo span{background:linear-gradient(90deg,var(--ac2),#c06bff);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;margin-left:6px}
.bal{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff3b0,var(--ac) 50%,#c28a00);display:inline-block;box-shadow:0 0 12px #ffc83d66}
.bal .v{font-size:22px;font-weight:800;color:var(--ac);min-width:60px}
.bal input{width:110px;padding:8px 10px}
input{background:var(--card2);border:1px solid var(--bd);color:var(--txt);border-radius:10px;font-size:16px;outline:none}
input:focus{border-color:var(--ac2)}
input:disabled{opacity:.5;cursor:not-allowed}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;font-weight:700;color:var(--txt);background:var(--card2);transition:.15s}
button:hover{filter:brightness(1.2)}button:active{transform:scale(.97)}
button:disabled{opacity:.55;cursor:not-allowed;filter:none;transform:none}
.pri{background:linear-gradient(135deg,var(--ac2),#a24bff)}
.gold{background:linear-gradient(135deg,#ffd45e,#f0a500);color:#2a1d00}
.tg{background:linear-gradient(135deg,#2aabee,#1c82c9);color:#fff}
.danger{background:#3a1822;color:#ff8da1}
.actions{display:flex;gap:8px;margin-bottom:16px}
.actions button{flex:1;padding:11px}
.tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px;margin-bottom:16px;border:1px solid var(--bd)}
.tabs button{flex:1 0 auto;background:transparent;color:var(--mut);padding:11px 6px;font-size:12px;text-transform:uppercase;letter-spacing:.2px}
.tabs button.on{background:linear-gradient(135deg,var(--ac2),#a24bff);color:#fff}
.sec{display:none}.sec.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.case{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;text-align:center;position:relative}
.case.allin{border-color:#ff5470aa;background:linear-gradient(160deg,#2a1420,var(--card))}
.case.free{border-color:#38d98aaa;background:linear-gradient(160deg,#10281f,var(--card))}
.tag{position:absolute;top:10px;right:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px;letter-spacing:.5px}
.free .tag{background:var(--ok);color:#06271a}
.case .ic{font-size:64px;line-height:1.1;filter:drop-shadow(0 6px 14px #0008)}
.case h3{margin:8px 0 2px}
.price{color:var(--ac);font-weight:800;margin-bottom:12px}
.free .price{color:var(--ok)}
.row{display:flex;gap:8px}.row button{flex:1}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}
.box{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.box input{width:100%;padding:12px}
.item{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:12px;padding:10px 12px;margin:8px 0;border-left:4px solid var(--c)}
.item .e{font-size:26px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}
.item .n{flex:1;font-weight:600}
.item .p{text-align:right;font-weight:800}
.item .p i{display:block;font-style:normal;color:var(--c);font-size:13px}
.gi{object-fit:contain;display:block;margin:0 auto;filter:drop-shadow(0 6px 12px #0009)}
.res{text-align:center;padding:10px 0}
.res .big{font-size:84px;min-height:120px;display:flex;align-items:center;justify-content:center}
.res .amt{font-size:28px;font-weight:900;color:var(--ac)}
.spin{animation:pulse .25s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.up{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.up{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px}
.dialw{position:relative;width:240px;height:240px;margin:0 auto}
.dial{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--ok) 0deg,var(--ok) 0deg,#2b2f4d 0deg)}
.dialw::after{content:"";position:absolute;inset:22px;background:var(--card);border-radius:50%}
.needle{position:absolute;inset:0;z-index:2;transition:transform 3.2s cubic-bezier(.12,.7,.1,1)}
.needle::before{content:"";position:absolute;left:50%;top:-4px;width:6px;height:60px;margin-left:-3px;border-radius:4px;background:#fff;box-shadow:0 0 10px #fff}
.mid{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mid b{font-size:32px}.mid span{color:var(--mut);font-size:13px}
label{display:block;color:var(--mut);font-size:13px;margin:12px 0 5px}
.f{display:flex;gap:6px}.f input{flex:1;min-width:0;padding:11px}.f button{padding:9px 10px}
input[type=range]{width:100%;padding:0;accent-color:var(--ac2);margin-top:8px}
.info{display:flex;justify-content:space-between;background:var(--card2);border-radius:12px;padding:10px 12px;margin-top:12px}
.info b{color:var(--ac)}
.msg{min-height:24px;text-align:center;margin-top:12px;font-weight:800;line-height:1.4}
.msg.w{color:var(--ok)}.msg.l{color:var(--bad)}
.msg small{display:block;color:var(--mut);font-weight:600;font-size:14px}
.err{color:var(--bad);font-size:13px;min-height:16px;margin-top:4px}
.pcard{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;text-align:center}
.ava{width:92px;height:92px;border-radius:50%;margin:0 auto 10px;background:linear-gradient(135deg,var(--ac2),#c06bff);display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;overflow:hidden;border:3px solid var(--ac)}
.ava img{width:100%;height:100%;object-fit:cover}
.pname{font-size:22px;font-weight:900;word-break:break-word}
.puser{color:var(--mut);font-size:14px;margin-top:2px}
.lvl{display:inline-block;margin:10px 0 4px;background:var(--card2);border:1px solid var(--bd);padding:5px 12px;border-radius:20px;font-size:13px;font-weight:800;color:var(--ac)}
.bar{height:8px;background:var(--card2);border-radius:8px;overflow:hidden;margin:6px auto 0;max-width:260px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:8px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--ac);word-break:break-word}
.stat span{color:var(--mut);font-size:12px}
.pact{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.pact button{padding:12px}
.hint{color:var(--mut);font-size:12px;text-align:center;margin-top:-2px}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:340px;margin:0 auto}
.cell{aspect-ratio:1;border-radius:12px;background:var(--card2);border:1px solid var(--bd);font-size:28px;display:flex;align-items:center;justify-content:center;padding:0;overflow:hidden}
.cell:disabled{opacity:1}
.cell.safe{background:#10281f;border-color:var(--ok);animation:pop .25s}
.cell.bomb{background:#3a1822;border-color:var(--bad)}
.cell.dim{opacity:.5}
.cell.hit{opacity:1;box-shadow:0 0 14px var(--bad)}
.cell img{width:78%;height:78%}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}
.step{display:flex;gap:6px;align-items:center}.step input{text-align:center}.step button{width:46px;flex:none;padding:10px 0;font-size:18px}
.item .n small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.sep{height:1px;background:var(--bd);margin:16px 0}
.ban{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ban.on{display:flex}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--ac);color:var(--txt);padding:12px 16px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo"><b>STANDFADE</b><span>earn</span></div>
  <div class="bal"><i class="coin"></i><div class="v" id="bal">0</div><span style="color:var(--mut);font-size:13px">gold</span></div>
</header>

<div class="actions">
  <button class="gold" id="wdBtn">💸 Вывести</button>
  <button class="tg" id="contactBtn">✈️ Связь с создателем</button>
</div>

<div class="tabs">
  <button class="on" data-t="case">Case</button>
  <button data-t="upgrade">Upgrade</button>
  <button data-t="mines">Mines</button>
  <button data-t="top">🏆 Top</button>
  <button data-t="profile">Profile</button>
</div>

<section class="sec on" id="case"><div class="grid" id="cases"></div></section>

<section class="sec" id="upgrade"><div class="up">
  <div class="panel">
    <div class="dialw"><div class="dial" id="dial"></div><div class="needle" id="needle"></div>
      <div class="mid"><b id="pc">50%</b><span id="mx">x2.00</span></div></div>
    <div class="msg" id="umsg"></div>
  </div>
  <div class="panel">
    <label>Ставка (gold, только целые, мин. 1)</label>
    <div class="f"><input id="bet" inputmode="numeric" value="10">
      <button data-b="half">½</button><button data-b="x2">x2</button><button data-b="max">MAX</button></div>
    <label>Шанс (%) — от 0.1 до 75</label>
    <div class="f"><input id="pct" inputmode="decimal" value="50"></div>
    <input type="range" id="rng" min="0.1" max="75" step="0.1" value="50">
    <div class="info"><span>Множитель</span><b id="mul">x2.00</b></div>
    <div class="info"><span>Выигрыш</span><b id="win">20</b></div>
    <div class="err" id="uerr"></div>
    <button class="pri" id="go" style="width:100%;margin-top:8px;padding:14px;font-size:17px">Апгрейд</button>
  </div>
</div></section>

<section class="sec" id="mines"><div class="up">
  <div class="panel">
    <div class="mgrid" id="mgrid"></div>
    <div class="msg" id="mmsg"></div>
  </div>
  <div class="panel">
    <label>Ставка (gold, только целые, мин. 1)</label>
    <div class="f"><input id="mbet" inputmode="numeric" value="10">
      <button data-mb="half">½</button><button data-mb="x2">x2</button><button data-mb="max">MAX</button></div>
    <label>Количество бомб (от 1 до 24)</label>
    <div class="step"><button id="bm">−</button><input id="mbomb" inputmode="numeric" value="3"><button id="bp">+</button></div>
    <input type="range" id="mrng" min="1" max="24" step="1" value="3">
    <div class="info"><span>Множитель сейчас</span><b id="mcur">x1.00</b></div>
    <div class="info"><span>Забрать сейчас</span><b id="mcash">0 gold</b></div>
    <div class="info"><span>Следующая ячейка</span><b id="mnext">—</b></div>
    <div class="err" id="merr"></div>
    <button class="pri" id="mstart" style="width:100%;margin-top:8px;padding:14px;font-size:17px">Играть</button>
    <button class="gold" id="mcashout" style="width:100%;margin-top:8px;padding:14px;font-size:17px" hidden>Забрать</button>
    <div class="hint" style="margin-top:10px">Ставка списывается при старте. Откройте хотя бы одну ячейку, чтобы забрать выигрыш. Множитель учитывает комиссию 3%.</div>
  </div>
</div></section>

<section class="sec" id="top"><div id="topBox"></div></section>

<section class="sec" id="profile"><div id="profBox"></div></section>
</div>

<div id="toast"></div>
<div class="ban" id="ban"><div class="box"><div class="res"><div class="big">⛔</div><h3>Доступ закрыт</h3><p>Ваш аккаунт заблокирован администратором.</p></div>
  <button class="tg" id="banTg" style="width:100%">Связаться с создателем</button></div></div>

<div class="modal" id="modal"><div class="box" id="mbox"></div></div>

const COLS=['#8b90b3','#4db8ff','#7c5cff','#ff6bd6','#ffc83d'];

const mkAllIn=price=>({id:'a'+price,name:'Всё или ничего',tag:'ALL-IN',ic:'🎰',price,items:[{n:'Gold',v:50,w:95,c:'#8b90b3'},{n:'Gold',v:price*7,w:5,c:'#ffc83d'}]});

let bal=1000,freeLast=0,resetLast=0,pct=50,tab='case',pend=0,betSaved='10',nick='',mg=null,mbetSaved='10',mbombSaved='3',banned=false,appliedAdj=[];
let st={cases:0,ups:0,upWins:0,best:0,added:0,withdrawn:0,mines:0,joined:Date.now()};
const num=v=>Number.isFinite(v)&&v>=0?Math.floor(v):0;
try{
  let r=null;
  try{r=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!r&&!tgUser){
    try{r=JSON.parse(localStorage.getItem('sfe_state_v1'))}catch(e){}
  }
  if(r&&typeof r==='object'){
    if(Number.isFinite(r.bal)&&r.bal>=0)bal=Math.floor(r.bal);
    if(Number.isFinite(r.free)&&r.free>0)freeLast=r.free;
    if(Number.isFinite(r.reset)&&r.reset>0)resetLast=r.reset;
    if(Number.isFinite(r.pct))pct=Math.min(75,Math.max(0.1,r.pct));
    if(['upgrade','mines','top','profile'].includes(r.tab))tab=r.tab;
    if(Number.isFinite(r.pend)&&r.pend>0)pend=Math.floor(r.pend);
    if(/^\d{1,15}$/.test(String(r.bet||'')))betSaved=String(r.bet);
    if(typeof r.nick==='string')nick=r.nick.slice(0,20);
    if(/^\d{1,15}$/.test(String(r.mbet||'')))mbetSaved=String(r.mbet);
    if(/^\d{1,2}$/.test(String(r.mbomb||''))&&r.mbomb>=1&&r.mbomb<=24)mbombSaved=String(r.mbomb);
    if(r.ban===true)banned=true;
    if(Array.isArray(r.adj))appliedAdj=r.adj.filter(x=>typeof x==='string').slice(-300);
    const g=r.mg;
    if(g&&typeof g==='object'&&Number.isFinite(g.bet)&&g.bet>=1&&Number.isInteger(g.bombs)&&g.bombs>=1&&g.bombs<=24
      &&Array.isArray(g.pos)&&g.pos.length===g.bombs&&g.pos.every(x=>Number.isInteger(x)&&x>=0&&x<25)&&new Set(g.pos).size===g.bombs
      &&Array.isArray(g.open)&&g.open.every(x=>Number.isInteger(x)&&x>=0&&x<25&&!g.pos.includes(x))&&new Set(g.open).size===g.open.length)
      mg={bet:Math.floor(g.bet),bombs:g.bombs,pos:g.pos,open:g.open,done:!!g.done,hit:Number.isInteger(g.hit)?g.hit:-1};
    if(r.st&&typeof r.st==='object'){
      st.cases=num(r.st.cases);st.ups=num(r.st.ups);st.upWins=num(r.st.upWins);
      st.best=num(r.st.best);st.mines=num(r.st.mines);st.added=num(r.st.added);st.withdrawn=num(r.st.withdrawn);
      if(Number.isFinite(r.st.joined)&&r.st.joined>0)st.joined=r.st.joined;
    }
  }
}catch(e){}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({bal,free:freeLast,reset:resetLast,pct,tab,pend,bet:$('bet').value,mbet:$('mbet').value,mbomb:$('mbomb').value,mg,ban:banned,adj:appliedAdj,nick,st}))}catch(e){}
  if(tab==='profile')renderProfile();
}
function setBal(v){
  bal=Math.max(0,Math.floor(v));
  $('bal').textContent=fmt(bal);
  save();
  refresh();
}

  save();
  if(t==='top')loadTop();
}

function leftMs(last,cd){
  if(!last)return 0;
  const left=last+cd-Date.now();
  return Math.max(0,Math.min(left,cd));
}
const freeLeft=()=>leftMs(freeLast,FREE_COOLDOWN);
const resetLeft=()=>leftMs(resetLast,RESET_COOLDOWN);
function fmtTime(ms){
  const s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  const p=n=>String(n).padStart(2,'0');
  return p(h)+':'+p(m)+':'+p(x);
}
function updateFree(){
  const b=$('btn-free');if(!b)return;
  const left=freeLeft();
  if(left>0){b.disabled=true;b.textContent='⏳ '+fmtTime(left)}
  else{b.disabled=false;b.textContent='Открыть'}
}
function updateReset(){
  const b=$('resetBtn');if(!b)return;
  const left=resetLeft();
  if(left>0){b.disabled=true;b.textContent='⏳ Сброс доступен через '+fmtTime(left)}
  else{b.disabled=false;b.textContent='🗑 Сбросить прогресс'}
}
setInterval(()=>{updateFree();updateReset()},1000);

/* ---------- Telegram: связь и вывод ---------- */
function copyText(t){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).catch(()=>{});return}
  }catch(e){}
  try{
    const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();
    document.execCommand('copy');document.body.removeChild(a);
  }catch(e){}
}
function openTg(text){
  const web='https://t.me/'+TG_USER;
  const chrome='intent://t.me/'+TG_USER+'#Intent;scheme=https;package=com.android.chrome;end';

$('cases').onclick=e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  const c=CASES.find(x=>x.id===b.dataset.i);
  b.dataset.a==='view'?viewCase(c):openCase(c);
};
function viewCase(c){
  const p=pcts(c);
  show(`<h3 style="margin-top:0">${c.ic} ${c.name} — ${c.free?'бесплатно':fmt(c.price)+' gold'}</h3>`+
  (c.free?`<p style="color:var(--mut);margin:0">Можно открывать раз в 24 часа.</p>`:'')+
  c.items.map((i,k)=>`<div class="item" style="--c:${i.c}"><span class="e">${itemImg(i.v,44)}</span><span class="n">Gold</span>
  <span class="p">${fmt(i.v)} gold<i>${+p[k].toFixed(2)}%</i></span></div>`).join('')+
  `<div class="row" style="margin-top:12px"><button data-x>Закрыть</button><button class="pri" id="mo">Открыть</button></div>`);
  $('mo').onclick=()=>openCase(c);
}
let busy=false;
function openCase(c){
  if(busy||ubusy)return;
  if(c.free){
    const left=freeLeft();
    if(left>0){
      show(`<div class="res"><div class="big">⏳</div><p>Бесплатный кейс уже открыт.<br>Следующий через <b style="color:var(--ac)">${fmtTime(left)}</b></p></div><button data-x style="width:100%">Закрыть</button>`);
      return;
    }
  }else if(bal<c.price){
    show(`<div class="res"><div class="big">😕</div><p>Недостаточно gold.<br>Нужно ${fmt(c.price)}, у вас ${fmt(bal)}.</p></div><button data-x style="width:100%">Закрыть</button>`);
    return;
  }
  busy=true;
  const p=pcts(c);
  let r=Math.random()*100,k=0;
  for(;k<p.length-1;k++){if(r<p[k])break;r-=p[k]}
  const win=c.items[k];
  pend=win.v;
  st.cases++;
  if(c.free){freeLast=Date.now();updateFree();setBal(bal)}
  else setBal(bal-c.price);
  let n=0;
  show(`<div class="res"><div class="big spin" id="rl">❓</div><p>Открываем…</p></div>`,true);
  const t=setInterval(()=>{
    $('rl').innerHTML=itemImg(c.items[Math.floor(Math.random()*c.items.length)].v,110);
    if(++n>16){
      clearInterval(t);
      pend=0;
      if(win.v>st.best)st.best=win.v;
      setBal(bal+win.v);
      busy=false;
      const plus=win.v>=c.price;
      show(`<div class="res"><div class="big">${itemImg(win.v,130)}</div><h3 style="color:${win.c};margin:4px 0">Gold</h3>
      <div class="amt">+${fmt(win.v)} gold</div>
      <p style="color:${plus?'var(--ok)':'var(--mut)'}">${c.free?'Приходи за новым кейсом через 24 часа!':plus?'В плюсе!':'Повезёт в следующий раз'}</p></div>
      <div class="row"><button data-x>Закрыть</button>${c.free?'':`<button class="pri" id="again">Ещё раз (${fmt(c.price)})</button>`}</div>`);
      if(!c.free)$('again').onclick=()=>openCase(c);
    }
  },110);
}

  $('mbox').innerHTML=h;
  $('modal').classList.add('on');
  $('modal').dataset.lock=lock?'1':'';
}
$('modal').onclick=e=>{
  if($('modal').dataset.lock)return;

};

/* ---------- апгрейдер ---------- */
let rot=0,ubusy=false;
const calcWin=(b,p)=>Math.max(b+1,Math.floor(b*100/p));
function getBet(){return digits($('bet').value)}
function lockUp(l){
  ['bet','pct','rng'].forEach(id=>$(id).disabled=l);
  document.querySelectorAll('[data-b]').forEach(b=>b.disabled=l);
}
function drawDial(){
  const d=pct*3.6;
  $('dial').style.background=`conic-gradient(var(--ok) 0deg ${d}deg,#2b2f4d ${d}deg 360deg)`;
  $('pc').textContent=(+pct.toFixed(1))+'%';
  $('mx').textContent='x'+(100/pct).toFixed(2);
}
function refresh(){
  const b=getBet();
  let err='';
  if(b<1)err='Минимальная ставка — 1 gold';
  else if(b>bal)err='Ставка больше баланса';
  $('uerr').textContent=ubusy?'':err;
  $('mul').textContent='x'+(100/pct).toFixed(2);
  $('win').textContent=b>=1?fmt(calcWin(b,pct))+' gold':'—';
  $('go').disabled=ubusy||busy||!!err;
  mRefresh();
}
function setPct(v){
  if(ubusy)return;
  v=parseFloat(String(v).replace(',','.'));
  if(isNaN(v))v=0.1;
  pct=Math.min(75,Math.max(0.1,Math.round(v*10)/10));
  $('rng').value=pct;
  drawDial();refresh();save();
}
$('bet').oninput=e=>{if(ubusy)return;e.target.value=e.target.value.replace(/\D/g,'').slice(0,15);refresh();save()};
$('pct').oninput=e=>{
  if(ubusy)return;
  e.target.value=e.target.value.replace(/[^\d.,]/g,'');
  const v=parseFloat(e.target.value.replace(',','.'));
  if(!isNaN(v)&&v>=0.1&&v<=75){pct=Math.round(v*10)/10;$('rng').value=pct;drawDial();refresh();save()}
};
$('pct').onblur=()=>{if(ubusy)return;setPct($('pct').value);$('pct').value=pct};
$('rng').oninput=e=>{if(ubusy)return;setPct(e.target.value);$('pct').value=pct};
document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{
  if(ubusy)return;
  let v=getBet(),k=b.dataset.b;
  v=k==='half'?Math.max(1,Math.floor(v/2)):k==='x2'?Math.max(1,v*2):Math.max(1,bal);
  $('bet').value=Math.min(v,999999999999999);
  refresh();save();
});
$('go').onclick=()=>{
  const b=getBet();
  if(ubusy||busy||b<1||b>bal)return;
  ubusy=true;
  lockUp(true);
  $('go').disabled=true;
  $('umsg').textContent='';$('umsg').className='msg';
  const ok=Math.random()*100<pct,d=pct*3.6,curPct=pct;
  const payout=ok?calcWin(b,curPct):0;
  pend=payout;
  st.ups++;
  setBal(bal-b);
  const ang=ok?Math.random()*(d-6)+3:d+3+Math.random()*(360-d-6);
  rot=Math.ceil(rot/360)*360+360*5+ang;
  $('needle').style.transform=`rotate(${rot}deg)`;
  setTimeout(()=>{
    ubusy=false;
    lockUp(false);
    pend=0;
    if(ok){
      st.upWins++;
      if(payout>st.best)st.best=payout;
      setBal(bal+payout);
      $('umsg').className='msg w';
      $('umsg').textContent=`Победа! +${fmt(payout)} gold`;
    }else{
      setBal(bal);
      $('umsg').className='msg l';
      $('umsg').innerHTML=`Проигрыш −${fmt(b)} gold<small>Повезёт в следующий раз!</small>`;
    }
  },3300);
};

/* ---------- MINES (поле 5x5) ---------- */
const MN=25,MEDGE=0.97;
const mActive=()=>!!(mg&&!mg.done);
function mMult(b,k){if(k<=0)return 1;let m=MEDGE;for(let i=0;i<k;i++)m*=(MN-i)/(MN-b-i);return m}
const mPay=(bet,b,k)=>Math.floor(bet*mMult(b,k));
const mBet=()=>digits($('mbet').value);
function mBombs(){const v=digits($('mbomb').value);return Math.min(24,Math.max(1,v||1))}
function mSetBombs(v){v=Math.min(24,Math.max(1,v));$('mbomb').value=v;$('mrng').value=v;mInfo();save()}
function mRefresh(){
  const b=mBet(),act=mActive();let err='';
  if(!act){if(b<1)err='Минимальная ставка — 1 gold';else if(b>bal)err='Ставка больше баланса'}
  $('merr').textContent=err;
  $('mstart').disabled=act||busy||!!err;
}
function mDraw(){
  const act=mActive();let h='';
  for(let i=0;i<MN;i++){
    const op=mg&&mg.open.includes(i),bomb=mg&&mg.pos.includes(i);
    let cls='cell',inner='';
    if(op){cls+=' safe';inner=`<img class="gi" src="${IMG_SMALL}" alt="gold">`}
    else if(mg&&mg.done&&bomb){cls+=mg.hit===i?' bomb hit':' bomb dim';inner=mg.hit===i?'💥':'💣'}
    else if(mg&&mg.done){cls+=' dim'}
    h+=`<button class="${cls}" data-i="${i}" ${act?'':'disabled'}>${inner}</button>`;
  }
  $('mgrid').innerHTML=h;
}
function mInfo(){
  const act=mActive(),k=mg?mg.open.length:0;
  if(act){
    const cur=mMult(mg.bombs,k),cash=k?mPay(mg.bet,mg.bombs,k):0,left=MN-mg.bombs-k;
    $('mcur').textContent='x'+cur.toFixed(2);
    $('mcash').textContent=fmt(cash)+' gold';
    $('mnext').textContent=left>0?'x'+mMult(mg.bombs,k+1).toFixed(2)+' ('+fmt(mPay(mg.bet,mg.bombs,k+1))+' gold)':'—';
    $('mcashout').disabled=k===0;
    $('mcashout').textContent=k?'💰 Забрать '+fmt(cash)+' gold (x'+cur.toFixed(2)+')':'Откройте ячейку';
  }else{
    $('mcur').textContent='x1.00';
    $('mcash').textContent='0 gold';
    $('mnext').textContent='x'+mMult(mBombs(),1).toFixed(2);
  }
  $('mstart').hidden=act;
  $('mcashout').hidden=!act;
  ['mbet','mbomb','mrng','bm','bp'].forEach(id=>$(id).disabled=act);
  document.querySelectorAll('[data-mb]').forEach(b=>b.disabled=act);
  mRefresh();
}
function mStart(){
  if(mActive()||busy||ubusy)return;
  const bet=mBet(),b=mBombs();
  if(bet<1||bet>bal)return;
  const idx=[...Array(MN).keys()];
  for(let i=MN-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
  mg={bet,bombs:b,pos:idx.slice(0,b),open:[],done:false,hit:-1};
  st.mines++;
  $('mbomb').value=b;$('mrng').value=b;
  $('mmsg').className='msg';
  $('mmsg').textContent='Открывайте ячейки. Не попадите на бомбу!';
  setBal(bal-bet); // списываем ставку и сохраняем игру
  mDraw();mInfo();
}
function mCash(){
  if(!mActive()||!mg.open.length)return;
  const k=mg.open.length,pay=mPay(mg.bet,mg.bombs,k);
  mg.done=true;
  if(pay>st.best)st.best=pay;
  setBal(bal+pay);
  $('mmsg').className='msg w';
  $('mmsg').innerHTML=`Победа! +${fmt(pay)} gold<small>Множитель x${mMult(mg.bombs,k).toFixed(2)}</small>`;
  mDraw();mInfo();
}
$('mgrid').onclick=e=>{
  const c=e.target.closest('.cell');
  if(!c||c.disabled||!mActive())return;
  const i=+c.dataset.i;
  if(mg.open.includes(i))return;
  if(mg.pos.includes(i)){
    mg.done=true;mg.hit=i;
    $('mmsg').className='msg l';
    $('mmsg').innerHTML=`Бомба! −${fmt(mg.bet)} gold<small>Повезёт в следующий раз!</small>`;
    setBal(bal); // сохраняем
    mDraw();mInfo();
    return;
  }
  mg.open.push(i);
  const k=mg.open.length;
  if(k===MN-mg.bombs){mCash();return} // открыты все безопасные ячейки
  const cur=mMult(mg.bombs,k),cash=mPay(mg.bet,mg.bombs,k);
  $('mmsg').className='msg w';
  $('mmsg').innerHTML=`Ячейка ${k}: x${cur.toFixed(2)}<small>Если остановить игру, вы получите ${fmt(cash)} gold</small>`;
  save();mDraw();mInfo();
};
$('mstart').onclick=mStart;
$('mcashout').onclick=mCash;
$('mbet').oninput=e=>{if(mActive())return;e.target.value=e.target.value.replace(/\D/g,'').slice(0,15);mRefresh();save()};

/* ---------- СЕРВЕР: промокоды, бан, админка ---------- */
const API_BASE='';            // пусто = сервер на том же адресе, что и игра
const ADMIN_ID=8231559792;    // главный админ (проверка на самом сервере, здесь только для показа кнопки)
const fmtDate=ts=>ts?new Date(ts).toLocaleString('ru-RU'):'—';
let toastT=null;
function toast(m){const el=$('toast');el.textContent=m;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),4500)}
async function api(route,body){
  const initData=tgApp&&tgApp.initData?tgApp.initData:'';
  if(!initData)throw{code:'no_tg'};
  let res;
  try{res=await fetch(API_BASE+'/api/'+route,{method:'POST',headers:{'Content-Type':'application/json','X-Init-Data':initData},body:JSON.stringify(body||{})})}
  catch(e){throw{code:'offline'}}
  let j=null;try{j=await res.json()}catch(e){}
  if(!j)throw{code:'offline'};
  if(!res.ok)throw{code:j.error||('http_'+res.status),msg:j.message};
  return j;
}
const errText=e=>e&&e.msg?e.msg:({no_tg:'Откройте игру через Telegram-бота. Вне Telegram это не работает.',offline:'Нет связи с сервером. Игра должна быть запущена через ваш сервер.'}[e&&e.code]||'Ошибка'+(e&&e.code?': '+e.code:''));
function setBanned(v){banned=!!v;$('ban').classList.toggle('on',banned);save()}
$('banTg').onclick=()=>{const u='https://t.me/'+TG_USER;if(tgApp&&tgApp.openTelegramLink)tgApp.openTelegramLink(u);else window.open(u,'_blank')};
function applyAdjs(list,silent){
  const fresh=list.filter(a=>!appliedAdj.includes(a.id));
  let total=0;
  fresh.forEach(a=>{total+=a.amount;appliedAdj.push(a.id)});
  appliedAdj=appliedAdj.slice(-300);
  if(fresh.length){
    setBal(bal+total);
    if(!silent)toast(total>=0?'🎁 Вам начислено +'+fmt(total)+' gold':'Администратор списал '+fmt(-total)+' gold');
  }
  api('ack',{ids:list.map(a=>a.id)}).catch(()=>{});
}
let syncing=false;
async function sync(){
  if(syncing||!tgApp||!tgApp.initData)return;
  syncing=true;
  try{
    const r=await api('me',{bal,nick});
    setBanned(!!r.banned);
    if(r.adjs&&r.adjs.length)applyAdjs(r.adjs);
  }catch(e){}
  syncing=false;
}
setInterval(sync,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});

function promoModal(){
  show(`<h3 style="margin-top:0">🎟 Промокод</h3>
  <label>Введите промокод</label>
  <input id="pcIn" maxlength="24" placeholder="Например: GOLD2026" autocapitalize="characters" autocomplete="off">
  <div class="err" id="pcErr"></div>
  <div class="row" style="margin-top:10px"><button data-x>Закрыть</button><button class="gold" id="pcGo">Активировать</button></div>`);
  const say=(t,ok)=>{const el=$('pcErr');if(el){el.style.color=ok?'var(--ok)':'';el.textContent=t}};
  $('pcIn').oninput=e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9_-]/g,'');
  $('pcGo').onclick=async()=>{
    const code=$('pcIn').value.trim();
    if(!code){say('Введите промокод');return}
    $('pcGo').disabled=true;
    try{
      const r=await api('promo/redeem',{code});
      applyAdjs([r.adj],true);
      say('✅ Начислено +'+fmt(r.amount)+' gold',true);
      if($('pcIn'))$('pcIn').value='';
    }catch(e){say(errText(e))}
    if($('pcGo'))$('pcGo').disabled=false;
  };
}

function adminModal(){
  show(`<h3 style="margin-top:0">🛠 Админ-панель</h3>
  <b>Создать промокод</b>
  <label>Код (пусто = создать случайный)</label>
  <input id="apCode" maxlength="24" autocomplete="off">
  <label>Сколько gold даёт</label>
  <input id="apAmt" inputmode="numeric" placeholder="например 500">
  <label>Сколько человек могут активировать</label>
  <input id="apMax" inputmode="numeric" value="1">
  <button class="gold" id="apCreate" style="width:100%;margin-top:10px">Создать</button>
  <div class="err" id="apMsg"></div>
  <div class="sep"></div>
  <b>Промокоды</b>
  <div id="apList" style="margin-top:6px">Загрузка…</div>
  <div class="sep"></div>
  <b>Игрок</b>
  <label>@юзернейм или ID</label>
  <input id="auQ" autocomplete="off" placeholder="@username">
  <button class="pri" id="auFind" style="width:100%;margin-top:10px">Найти</button>
  <div class="err" id="auFindMsg"></div>
  <div id="auRes"></div>
  <button data-x style="width:100%;margin-top:14px">Закрыть</button>`);
  const say=(id,t,ok)=>{const el=$(id);if(el){el.style.color=ok?'var(--ok)':'';el.textContent=t}};
  $('apCode').oninput=e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9_-]/g,'');
  $('apAmt').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,12);
  $('apMax').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,7);

  const loadList=async()=>{
    try{
      const r=await api('admin/promo/list');
      const el=$('apList');if(!el)return;
      el.innerHTML=r.promos.length?r.promos.map(p=>`<div class="item" style="--c:#ffc83d"><span class="n">${esc(p.code)}<small>+${fmt(p.amount)} gold · активаций ${p.used}/${p.maxUses}</small></span><button class="danger" data-del="${esc(p.code)}" style="flex:none">🗑</button></div>`).join(''):'<span style="color:var(--mut)">Пока нет промокодов</span>';
    }catch(e){const el=$('apList');if(el)el.textContent=errText(e)}
  };
  loadList();
  $('apCreate').onclick=async()=>{
    const amount=digits($('apAmt').value),maxUses=digits($('apMax').value);
    if(amount<1){say('apMsg','Укажите сумму gold');return}
    if(maxUses<1){say('apMsg','Укажите, сколько человек могут активировать');return}
    $('apCreate').disabled=true;
    try{
      const r=await api('admin/promo/create',{code:$('apCode').value.trim(),amount,maxUses});
      say('apMsg','✅ Создан: '+r.promo.code,true);
      copyText(r.promo.code);
      if($('apCode'))$('apCode').value='';
      loadList();
    }catch(e){say('apMsg',errText(e))}
    if($('apCreate'))$('apCreate').disabled=false;
  };
  $('apList').onclick=async e=>{
    const b=e.target.closest('[data-del]');if(!b)return;
    if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Точно?';return}
    b.disabled=true;
    try{await api('admin/promo/delete',{code:b.dataset.del});loadList()}catch(er){say('apMsg',errText(er))}
  };

  let cur=null;
  const drawUser=()=>{
    const el=$('auRes');if(!el)return;
    if(!cur){el.innerHTML='';return}
    el.innerHTML=`<div class="item" style="--c:${cur.banned?'#ff5470':'#38d98a'}"><span class="n">${esc(cur.first_name||'Игрок')}
      <small>${cur.username?'@'+esc(cur.username)+' · ':''}ID ${esc(cur.id)}</small>
      <small>Баланс (по данным устройства): ${cur.bal==null?'—':fmt(cur.bal)} gold</small>
      <small>Был(а) в игре: ${fmtDate(cur.lastSeen)}</small>
      <small>${cur.banned?'⛔ Забанен':'Активен'}${cur.pending?' · ждёт начислений: '+cur.pending:''}</small></span></div>
    <label>Сумма gold (целое число)</label>
    <input id="auAmt" inputmode="numeric" placeholder="например 1000">
    <div class="row" style="margin-top:8px"><button class="gold" data-act="give">➕ Выдать</button><button class="danger" data-act="take">➖ Забрать</button></div>
    <button class="${cur.banned?'pri':'danger'}" data-act="ban" style="width:100%;margin-top:8px">${cur.banned?'✅ Разбанить':'⛔ Забанить'}</button>
    <div class="err" id="auMsg"></div>`;
    const a=$('auAmt');if(a)a.oninput=ev=>ev.target.value=ev.target.value.replace(/\D/g,'').slice(0,12);
  };
  $('auFind').onclick=async()=>{
    const q=$('auQ').value.trim();if(!q)return;
    say('auFindMsg','');
    try{const r=await api('admin/user/find',{query:q});cur=r.user;drawUser()}
    catch(e){cur=null;drawUser();say('auFindMsg',errText(e))}
  };
  $('auRes').onclick=async e=>{
    const b=e.target.closest('[data-act]');if(!b||!cur)return;
    const act=b.dataset.act;b.disabled=true;
    try{
      if(act==='ban'){
        const r=await api('admin/user/ban',{id:cur.id,banned:!cur.banned});
        cur=r.user;drawUser();
        say('auMsg',cur.banned?'⛔ Игрок забанен (заблокируется при ближайшей синхронизации)':'✅ Игрок разбанен',true);
      }else{
        const n=digits($('auAmt').value);
        if(n<1){say('auMsg','Введите сумму');b.disabled=false;return}
        const r=await api('admin/user/gold',{id:cur.id,amount:act==='take'?-n:n});
        cur=r.user;drawUser();
        say('auMsg',(act==='take'?'Будет списано ':'Будет выдано ')+fmt(n)+' gold: игрок получит при ближайшей синхронизации',true);
      }
    }catch(er){say('auMsg',errText(er));b.disabled=false}
  };
}

/* ---------- ЛИДЕРБОРД ---------- */
async function loadTop(){
  const box=$('topBox');if(!box)return;
  box.innerHTML='<div class="pcard"><div class="puser">Загрузка…</div></div>';
  try{
    const r=await api('leaderboard',{bal,nick});
    const medal=['🥇','🥈','🥉'];
    box.innerHTML=`<div class="pcard"><h3 style="margin:0 0 4px">🏆 Лидерборд</h3><div class="puser">Топ игроков по балансу gold</div></div>
    <div style="margin-top:12px">${r.top.length?r.top.map((u,i)=>`<div class="item" style="--c:${u.me?'#7c5cff':i<3?'#ffc83d':'#2a2f4d'}"><span class="e" style="font-size:20px;font-weight:900">${medal[i]||(i+1)}</span><span class="n">${esc(u.name)}${u.me?'<small>это вы</small>':''}</span><span class="p">${fmt(u.bal)} gold</span></div>`).join(''):'<div class="puser" style="text-align:center">Пока никого нет</div>'}</div>
    <div class="item" style="--c:#7c5cff;margin-top:12px"><span class="n">Ваше место<small>из ${fmt(r.me.total)} игроков</small></span><span class="p">${r.me.rank?'#'+r.me.rank:'—'}<i>${fmt(r.me.bal)} gold</i></span></div>
    <button id="topRef" style="width:100%;margin-top:10px">🔄 Обновить</button>`;
    $('topRef').onclick=loadTop;
  }catch(e){
    box.innerHTML=`<div class="pcard"><div class="big" style="font-size:56px">🏆</div><p>${esc(errText(e))}</p><button class="pri" id="topRetry">Повторить</button></div>`;
    $('topRetry').onclick=loadTop;
  }
}
